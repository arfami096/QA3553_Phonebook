name: UI Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pytest with Allure
      run: pytest --headless -v || true

    - name: Get Allure history
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
              allure_results: allure-results
              allure_report: allure-report
              storage_path: allure-history
              keep_reports: 20

    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: allure-report
              keep_files: true

    - name: Send Telegram Notification
      uses: appleboy/telegram-action@master
      if: always()
      with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            - name: Send Telegram Notification
                uses: appleboy/telegram-action@master
                if: always()
                with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                    🤖 Результаты CI/CD тестов для Phonebook:
                    
                    Репозиторий: ${{ github.repository }}
                    Ветка: ${{ github.ref_name }}
                    Статус запуска: ${{ job.status }}
                    
                    🔗 Ссылка на Allure Отчет: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
                    📋 Лог GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}