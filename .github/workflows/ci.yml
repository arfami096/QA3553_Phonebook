name: UI Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with Allure for ${{ matrix.browser }}
        env:
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: pytest --browser ${{ matrix.browser }} --headless -v --alluredir=allure-results-${{ matrix.browser }}

      - name: Upload individual browser Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results-${{ matrix.browser }}/

  generate-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Скачиваем результаты Chrome
      - name: Download Chrome Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: allure-results-chrome

      # Скачиваем результаты Firefox
      - name: Download Firefox Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results-firefox

      # Настраиваем Java (требуется для работы генератора Allure)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Настраиваем Node.js для установки Allure CLI через npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Устанавливаем Allure CLI глобально через npm
      - name: Install Allure CLI
        run: sudo npm install -g allure-commandline --save-dev

      # Генерируем отчет для Chrome
      - name: Generate Chrome Allure Report
        run: allure generate allure-results-chrome -o allure-report/chrome --clean

      # Генерируем отчет для Firefox
      - name: Generate Firefox Allure Report
        run: allure generate allure-results-firefox -o allure-report/firefox --clean

      # Создаем стартовую страницу-навигатор (index.html) для выбора браузера
      - name: Create Index Navigator Page
        run: |
          cat << 'EOF' > allure-report/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <title>Phonebook UI Test Reports</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
                  h1 { color: #333; }
                  .container { margin-top: 30px; }
                  a { display: inline-block; margin: 10px 20px; padding: 15px 30px; font-size: 18px; color: white; background-color: #007bff; text-decoration: none; border-radius: 5px; transition: background 0.3s; }
                  a:hover { background-color: #0056b3; }
                  .firefox { background-color: #ff7139; }
                  .firefox:hover { background-color: #e0531c; }
              </style>
          </head>
          <body>
              <h1>📊 Phonebook UI Test Reports</h1>
              <p>Выберите браузер для просмотра результатов тестирования:</p>
              <div class="container">
                  <a href="chrome/">🌐 Chrome Report</a>
                  <a href="firefox/" class="firefox">🦊 Firefox Report</a>
              </div>
          </body>
          </html>
          EOF

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: true

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 CI/CD Test Results for Phonebook:
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            
            🔗 Allure Reports Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            📋 GitHub Actions Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}